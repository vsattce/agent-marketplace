interface:
  display_name: "自动准备与委派开发"
  short_description: "仅手动调用；自动生成并检查 SPEC、PLAN，直接委派开发、独立验收与整体检查。"
  default_prompt: "使用 $personal-dev:dev-auto，本次显式参数规范格式为 worker=<model>:<effort> reviewer=<model>:<effort>，按共享契约解析等价写法并归一化，严格校验当前 Harness 支持后整理需求为 SPEC / PLAN 并连续委派开发，普通需求不询问确认。"
policy:
  allow_implicit_invocation: false
