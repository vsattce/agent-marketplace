interface:
  display_name: "委派开发与独立验收"
  short_description: "仅手动调用；消费既定 SPEC、PLAN，以短路径完成开发、独立验收与最终核验，按需升级。"
  default_prompt: "使用 $personal-dev:dev-delegate 按已确定的 SPEC / PLAN 执行 SDD；本次显式参数规范格式为 worker=<model>:<effort> reviewer=<model>:<effort>，也接受 w 6luna high r 6.1terra high 等简写，按共享契约先归一化再校验当前 Harness 支持，展示精确配置后执行，缺项或不支持即停止。"
policy:
  allow_implicit_invocation: false
